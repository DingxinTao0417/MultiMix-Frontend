name: Display coverage

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 18 * * *"
  workflow_dispatch:

jobs:
  display-coverage:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          path: MultiMix-Frontend

      - name: Checkout backend main
        uses: actions/checkout@v4
        with:
          repository: DingxinTao0417/MultiMix-Backend
          ref: main
          path: MultiMix-Backend

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: MultiMix-Frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: MultiMix-Backend/pyproject.toml

      - name: Install frontend and Chromium
        working-directory: MultiMix-Frontend
        run: |
          npm ci
          npx playwright install chromium

      - name: Install backend
        working-directory: MultiMix-Backend
        run: python -m pip install -e ".[dev]"

      - name: Run display coverage
        working-directory: MultiMix-Frontend
        run: npm run test:display-coverage

      - name: Upload failure evidence only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: display-coverage-failure
          if-no-files-found: ignore
          path: |
            MultiMix-Frontend/playwright-report/**
            MultiMix-Frontend/test-results/**
            !MultiMix-Frontend/test-results/**/*.sqlite*
            !MultiMix-Frontend/test-results/**/.env*
