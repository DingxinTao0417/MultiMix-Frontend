<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方向 J · Immersive Cinema · 沉浸放映</title>
<style>
:root{
  --ink:#FFFFFF; --ink-2:rgba(255,255,255,.72); --ink-3:rgba(255,255,255,.44);
  --glass:rgba(18,18,22,.58); --glass-2:rgba(32,32,38,.72); --gline:rgba(255,255,255,.12);
  --ai:#8A7BFF; --ai-2:#2FE3C2; --grad:linear-gradient(118deg,#8A7BFF,#2FE3C2);
  --mine:#2FE3C2; --pub:#F0B964;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#07070A;color:var(--ink);overflow:hidden;
  font-family:"Segoe UI","Microsoft YaHei UI","PingFang SC","Noto Sans SC",sans-serif;
  font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
.mono{font-family:ui-monospace,"SF Mono",Consolas,monospace;font-variant-numeric:tabular-nums}

.room{position:relative;height:100vh;overflow:hidden}
/* ambient bed: the film's own colours bled out to fill the window */
.amb{position:absolute;inset:-8%;
  background:
    radial-gradient(42% 52% at 50% 44%,rgba(126,116,180,.5),transparent 70%),
    radial-gradient(60% 44% at 22% 74%,rgba(47,227,194,.16),transparent 72%),
    radial-gradient(54% 40% at 80% 26%,rgba(138,123,255,.2),transparent 70%),
    linear-gradient(170deg,#121119,#0A0A0E 55%,#131118);
  filter:blur(46px) saturate(1.25);transform:scale(1.06)}
.vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(110% 76% at 50% 46%,transparent 34%,rgba(0,0,0,.72) 86%)}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.045;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>")}

.glass{background:var(--glass);border:1px solid var(--gline);backdrop-filter:blur(22px) saturate(1.2);
  box-shadow:0 14px 40px -16px rgba(0,0,0,.7)}

/* top floating chrome */
.tl{position:absolute;top:16px;left:18px;z-index:40;display:flex;align-items:center;gap:9px}
.proj{display:flex;align-items:center;gap:9px;height:33px;padding:0 13px 0 5px;border-radius:999px;
  font-size:12.5px;font-weight:650}
.mk{width:23px;height:23px;border-radius:50%;background:var(--grad);display:grid;place-items:center;flex:none}
.proj .bd{min-width:17px;height:17px;padding:0 5px;border-radius:999px;background:rgba(255,255,255,.16);
  font-size:10.5px;font-weight:800;display:grid;place-items:center}
.pill{display:inline-flex;align-items:center;gap:7px;height:29px;padding:0 12px;border-radius:999px;
  font-size:11.5px;font-weight:650;color:#9FF4E4}
.pill .d{width:6px;height:6px;border-radius:50%;background:var(--ai-2);animation:bl 1.9s infinite}
@keyframes bl{50%{opacity:.2}}
.tr{position:absolute;top:16px;right:18px;z-index:40;display:flex;align-items:center;gap:8px}
.gb{height:33px;padding:0 15px;border-radius:999px;font-size:12.5px;font-weight:650;cursor:pointer;
  color:var(--ink-2);background:var(--glass);border:1px solid var(--gline);backdrop-filter:blur(22px)}
.gb:hover{color:var(--ink)}
.gb.pri{background:#fff;border-color:#fff;color:#0A0A0E;font-weight:750}

/* the film, dead centre, nothing framing it but light */
.screenwrap{position:absolute;inset:0;display:grid;place-items:center;z-index:20;padding-bottom:126px}
.screen{aspect-ratio:9/16;height:min(68vh,604px);border-radius:18px;overflow:hidden;position:relative;
  background:linear-gradient(162deg,#33323F,#15141B 56%,#242230);
  box-shadow:0 0 0 1px rgba(255,255,255,.1),0 0 90px -10px rgba(138,123,255,.42),
    0 50px 110px -30px rgba(0,0,0,.9)}
.play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:62px;height:62px;border-radius:50%;
  background:rgba(255,255,255,.96);display:grid;place-items:center;cursor:pointer;
  box-shadow:0 14px 40px rgba(0,0,0,.5)}
.sub{position:absolute;left:22px;right:22px;bottom:60px;text-align:center;font-size:17px;font-weight:750;
  line-height:1.45;text-shadow:0 2px 16px rgba(0,0,0,.9)}
.badge{position:absolute;top:16px;left:16px;display:inline-flex;align-items:center;gap:6px;height:23px;
  padding:0 9px;border-radius:999px;background:rgba(10,10,14,.6);backdrop-filter:blur(10px);
  font-size:10px;font-weight:800;color:#9FF4E4}
.tcb{position:absolute;bottom:22px;left:20px;font-size:11px;color:rgba(255,255,255,.72);font-weight:650}
.scr{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.18)}
.scr i{position:absolute;inset:0 87.5% 0 0;background:#fff}
.scr i::after{content:"";position:absolute;right:-5px;top:50%;transform:translateY(-50%);width:10px;height:10px;
  border-radius:50%;background:#fff;box-shadow:0 0 12px rgba(255,255,255,.8)}

/* filmstrip, floating */
.strip{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);z-index:40;
  border-radius:15px;padding:9px;display:flex;gap:8px;align-items:center}
.cell{width:52px;border-radius:9px;overflow:hidden;cursor:pointer;position:relative;
  border:1.5px solid transparent;transition:transform .14s}
.cell:hover{transform:translateY(-2px)}
.cell.on{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.14)}
.cell .im{width:100%;height:84px;background:linear-gradient(150deg,#34323F,#16151C)}
.cell .im.pub{background:repeating-linear-gradient(135deg,#34323F,#34323F 4px,#45424F 4px,#45424F 8px)}
.cell .lb{position:absolute;top:4px;left:4px;width:15px;height:15px;border-radius:4px;
  background:rgba(8,8,12,.72);font-size:9px;font-weight:800;display:grid;place-items:center}
.cell.on .lb{background:#fff;color:#0A0A0E}
.cell .du{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:8.5px;font-weight:700;
  color:rgba(255,255,255,.9);text-shadow:0 1px 4px rgba(0,0,0,.9)}
.cell .mk2{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--mine);
  box-shadow:0 0 0 2px rgba(8,8,12,.6)}
.cell .mk2.pub{background:var(--pub)}
.strip .sep{width:1px;height:50px;background:var(--gline);margin:0 3px}
.strip .tot{padding:0 10px 0 4px;text-align:left}
.strip .tot .a{font-size:10px;color:var(--ink-3);font-weight:700;letter-spacing:.06em}
.strip .tot .b{font-size:13px;font-weight:750;margin-top:1px}

/* chat: a quiet column of light on the left, no panel */
.talk{position:absolute;left:18px;bottom:18px;width:336px;z-index:40;display:grid;gap:11px;
  align-content:end;max-height:68vh}
.msgs{display:grid;gap:11px;align-content:end;overflow:hidden;
  mask-image:linear-gradient(transparent,#000 22%);-webkit-mask-image:linear-gradient(transparent,#000 22%)}
.me{justify-self:start;max-width:92%;border-radius:13px 13px 13px 3px;padding:8px 12px;font-size:12.5px;
  background:rgba(255,255,255,.1);border:1px solid var(--gline);backdrop-filter:blur(14px)}
.ai{display:grid;grid-template-columns:20px 1fr;gap:9px}
.av{width:20px;height:20px;border-radius:50%;background:var(--grad);display:grid;place-items:center;margin-top:2px}
.ai .tx{font-size:12.5px;line-height:1.66;color:var(--ink-2);text-shadow:0 1px 8px rgba(0,0,0,.6)}
.ai .tx b{color:var(--ink);font-weight:680}
.sugs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sug{height:27px;padding:0 11px;border-radius:999px;cursor:pointer;font-size:11.5px;
  background:rgba(255,255,255,.07);border:1px solid var(--gline);color:var(--ink-2);backdrop-filter:blur(14px)}
.sug:hover{color:var(--ink);border-color:rgba(255,255,255,.26)}
.composer{border-radius:15px;padding:9px 10px 7px}
.composer .ctx{display:inline-flex;align-items:center;gap:6px;height:21px;padding:0 4px 0 9px;border-radius:999px;
  background:rgba(138,123,255,.24);font-size:10.5px;font-weight:700;color:#CFC7FF;margin-bottom:7px}
.composer .ctx .x{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.18);color:#CFC7FF;
  font-size:9px;display:grid;place-items:center;border:0}
.composer .phx{font-size:12.5px;color:var(--ink-3);padding:0 2px 9px}
.composer .row{display:flex;align-items:center;gap:6px}
.ib{width:27px;height:27px;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid var(--gline);
  color:var(--ink-3);display:grid;place-items:center}
.snd{width:29px;height:29px;border-radius:50%;border:0;background:#fff;display:grid;place-items:center;margin-left:auto}
.srcnote{position:absolute;right:18px;bottom:18px;z-index:40;display:grid;gap:7px;justify-items:end}
.sn{display:inline-flex;align-items:center;gap:7px;height:27px;padding:0 11px;border-radius:999px;
  font-size:11px;font-weight:650;color:var(--ink-2);background:var(--glass);border:1px solid var(--gline);
  backdrop-filter:blur(18px)}
.sn i{width:7px;height:7px;border-radius:50%;flex:none}
.sn i.m{background:var(--mine)}
.sn i.p{background:var(--pub)}
</style>
</head>
<body>
<div class="room">
  <div class="amb"></div>
  <div class="vig"></div>
  <div class="grain"></div>

  <div class="tl">
    <div class="glass proj">
      <span class="mk"><svg width="14" height="14" viewBox="16 16 160 160" fill="none"><g transform="translate(11.35,20.86) scale(0.814)"><g fill="none" stroke="#0A0A0E" stroke-linecap="round" stroke-linejoin="round"><path d="M28 146V50c0-10 12-15 19-8l39 39 39-39c7-7 19-2 19 8v96" stroke-width="22"/><path d="M164 63l20 33-20 33" stroke-width="13"/></g></g></svg></span>
      门窗案例小红书内容<span class="bd">2</span>
    </div>
    <span class="glass pill"><span class="d"></span>AI 正在理解素材</span>
  </div>

  <div class="tr">
    <button class="gb">资料 · 6</button>
    <button class="gb">导出</button>
    <button class="gb pri">编辑</button>
  </div>

  <div class="screenwrap">
    <div class="screen">
      <span class="badge">✓ 来源已标注</span>
      <div class="play"><svg width="19" height="19" viewBox="0 0 16 16" fill="#0A0A0E"><path d="M5 3.2v9.6L13 8z"/></svg></div>
      <div class="sub">关窗之后，车声基本听不见了</div>
      <span class="tcb mono">00:04 / 00:32 · 第 1 镜</span>
      <div class="scr"><i></i></div>
    </div>
  </div>

  <div class="talk">
    <div class="msgs">
      <div class="me">这条视频我想突出隔音效果，用我上传的施工现场素材，30 秒左右。</div>
      <div class="ai">
        <div class="av"><svg width="10" height="10" viewBox="0 0 16 16" fill="#0A0A0E"><path d="M8 1.5l1.5 4L13.5 7 9.5 8.5 8 12.5 6.5 8.5 2.5 7l4-1.5z"/></svg></div>
        <div>
          <div class="tx">隔音测试那段现场音很清楚，我拿它当开场。<b>第 3 镜用的是公开素材</b>，底下那格有黄点。</div>
          <div class="sugs">
            <button class="sug">第 3 镜换成我的素材</button>
            <button class="sug">字幕再大一号</button>
            <button class="sug">看完整脚本</button>
          </div>
        </div>
      </div>
    </div>
    <div class="glass composer">
      <span class="ctx">正在说 第 1 镜<button class="x">×</button></span>
      <div class="phx">第 1 镜：想把这里改成…</div>
      <div class="row">
        <button class="ib"><svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M9.5 3.5 5 8a2.1 2.1 0 0 0 3 3l4.5-4.5a3.5 3.5 0 0 0-5-5L3 6.5a4.9 4.9 0 0 0 7 7l3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
        <button class="ib"><svg width="12" height="12" viewBox="0 0 16 16" fill="none"><rect x="2.5" y="3.5" width="11" height="9" rx="1.8" stroke="currentColor" stroke-width="1.4"/><circle cx="5.8" cy="6.6" r="1" fill="currentColor"/></svg></button>
        <button class="snd"><svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M8 13V3.5M8 3.5 4.3 7.2M8 3.5l3.7 3.7" stroke="#0A0A0E" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </div>
  </div>

  <div class="glass strip">
    <div class="cell on"><div class="im"></div><span class="lb">1</span><span class="mk2"></span><span class="du mono">7.2s</span></div>
    <div class="cell"><div class="im"></div><span class="lb">2</span><span class="mk2"></span><span class="du mono">6.0s</span></div>
    <div class="cell"><div class="im pub"></div><span class="lb">3</span><span class="mk2 pub"></span><span class="du mono">8.1s</span></div>
    <div class="cell"><div class="im"></div><span class="lb">4</span><span class="mk2"></span><span class="du mono">5.4s</span></div>
    <div class="cell"><div class="im"></div><span class="lb">5</span><span class="mk2"></span><span class="du mono">5.3s</span></div>
    <span class="sep"></span>
    <div class="tot"><div class="a">总时长</div><div class="b mono">32.0s</div></div>
  </div>

  <div class="srcnote">
    <span class="sn"><i class="m"></i>你的素材 · 4 镜</span>
    <span class="sn"><i class="p"></i>公开素材 · 1 镜</span>
  </div>
</div>
</body>
</html>
