<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>15 重置密码 · Canvas First</title>
<link rel="stylesheet" href="c-system.css?v=5">
<style>
body{overflow:hidden}
.page{height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 480px}
/* left: how it works, three steps with static sketches. no sample film, because nothing has been made yet */
.show{position:relative;overflow:hidden;background:var(--bg);display:grid;grid-template-rows:auto 1fr auto;padding:28px 40px 30px}
.show::before{content:"";position:absolute;width:640px;height:640px;border-radius:50%;filter:blur(110px);background:rgba(91,69,224,.09);top:-180px;left:-140px}
.show::after{content:"";position:absolute;width:520px;height:520px;border-radius:50%;filter:blur(110px);background:rgba(0,168,142,.08);bottom:-200px;right:-80px}
.show>*{position:relative;z-index:1}
.brand-top{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:750;letter-spacing:-.01em}
.brand-top .mk{width:28px;height:28px;border-radius:9px}
.mid{display:grid;align-content:center;gap:22px}
.mid h2{font-size:28px;font-weight:720;letter-spacing:-.024em;line-height:1.3;max-width:26ch}
.mid h2 em{white-space:nowrap;font-style:normal;background:var(--ai-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
/* same three real steps as the homepage, built from the same sample clip */
.flow{display:grid;gap:9px}
.flow .fh{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--ink-3);display:flex;align-items:center;gap:9px}
.flow .fh .ln{flex:1;height:1px;background:var(--line)}
.fstep{padding:12px 14px;border-radius:13px;background:var(--surface);border:1px solid var(--line)}
.fstep+.fstep{margin-top:8px}
.fstep .tx{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.fstep .tx b{font-size:13px;font-weight:680}
.fstep .tx span{font-size:11.5px;color:var(--ink-3)}
.fstep.ai{border:1px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--ai-grad) border-box}
.fstep .quote{font-size:12.5px;color:var(--ink);line-height:1.6;padding:9px 11px;border-radius:9px;background:var(--surface-2);
  border-left:2px solid var(--line-2)}
.fstep .fan{display:flex;gap:6px}
.fstep .fan i{flex:1;aspect-ratio:1/1;border-radius:8px;background-size:cover;background-position:center;position:relative}
.fstep .fan i .n{position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:4px;background:rgba(0,0,0,.55);color:#fff;
  font-size:8.5px;font-weight:800;display:grid;place-items:center}
.fstep .ba{display:flex;align-items:center;gap:8px}
.fstep .ba .cell{flex:1;position:relative}
.fstep .ba .cell i{display:block;aspect-ratio:1/1;border-radius:8px;background-size:cover;background-position:center}
.fstep .ba .cell span{position:absolute;bottom:4px;left:4px;height:16px;padding:0 6px;border-radius:4px;background:rgba(0,0,0,.6);
  color:#fff;font-size:9px;font-weight:700;display:grid;place-items:center}
.fstep .ba .ar{color:var(--ink-3);font-size:14px;flex:none}
.promise{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.promise span{display:inline-flex;align-items:center;gap:7px}
.promise i{width:6px;height:6px;border-radius:50%;background:var(--ai-grad)}

/* right: form, legal links stay on this page */
.form{background:var(--panel);border-left:1px solid var(--line);display:grid;align-content:center;padding:0 56px}
.form h1{font-size:25px;font-weight:720;letter-spacing:-.02em;line-height:1.35;margin-bottom:8px}
.form .sub{font-size:13.5px;color:var(--ink-2);margin-bottom:24px;line-height:1.7}
.tabs{display:flex;gap:2px;background:var(--surface-2);border-radius:999px;padding:3px;margin-bottom:20px;width:fit-content}
.tab{height:30px;padding:0 17px;border-radius:999px;border:0;background:transparent;color:var(--ink-2);font-size:12.5px;font-weight:650}
.tab.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(26,24,22,.1)}
.field{display:grid;gap:7px;margin-bottom:14px}
.field label{font-size:12px;font-weight:650;color:var(--ink-2)}
.field input{height:44px;padding:0 15px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);font:inherit;font-size:14px;color:var(--ink);outline:none}
.field input.f{border-color:transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--ai-grad) border-box}
.row{display:flex;align-items:center;justify-content:space-between;margin:2px 0 20px;font-size:12px;color:var(--ink-2)}
.row a{color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
.consent{display:flex;align-items:flex-start;gap:9px;line-height:1.6}
.consent .cb{width:16px;height:16px;border-radius:5px;background:var(--ink);display:grid;place-items:center;flex:none;margin-top:2px}
.submit{width:100%;height:46px;border-radius:12px;border:0;background:var(--ink);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.foot{margin-top:22px;font-size:11.5px;color:var(--ink-3);text-align:center}
.foot a{color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
.meter{display:flex;gap:4px;margin:-4px 0 6px}
.meter i{flex:1;height:4px;border-radius:2px;background:var(--surface-3)}
.meter i.on{background:var(--ok)}
.hint{font-size:11.5px;color:var(--ok);margin-bottom:14px}
</style>
</head>
<body>
<div class="page">
  <section class="show">
    <div class="brand-top">
      <span class="mk"><svg width="18" height="18" viewBox="16 16 160 160" fill="none"><g transform="translate(11.35,20.86) scale(0.814)"><g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round"><path d="M28 146V50c0-10 12-15 19-8l39 39 39-39c7-7 19-2 19 8v96" stroke-width="22"/><path d="M164 63l20 33-20 33" stroke-width="13"/></g></g></svg></span>
      MultiMix
    </div>

    <div class="mid">
      <h2>就是这条视频，<em>一步步</em>做出来的</h2>
      <div class="flow">
        <div class="fstep">
          <div class="tx"><b>1. 说出想法</b></div>
          <div class="quote">“我想做一条雨天巴黎街头的城市节奏短片，20 秒左右。”</div>
        </div>
        <div class="fstep ai">
          <div class="tx"><b>2. AI 排出 4 个分镜</b><span>一句话拆成 4 个真实镜头</span></div>
          <div class="fan">
            <i style="background-image:url('../assets/shot-basketball-sq.jpg')"><span class="n">1</span></i>
            <i style="background-image:url('../assets/shot-skate-sq.jpg')"><span class="n">2</span></i>
            <i style="background-image:url('../assets/shot-drum-sq.jpg')"><span class="n">3</span></i>
            <i style="background-image:url('../assets/shot-subway-sq.jpg')"><span class="n">4</span></i>
          </div>
        </div>
        <div class="fstep">
          <div class="tx"><b>3. 接着改</b><span>“军鼓那一镜拉近一点，突出细节。”</span></div>
          <div class="ba">
            <div class="cell"><i style="background-image:url('../assets/shot-drum-sq.jpg');filter:brightness(1.1) saturate(.7)"></i><span>改前</span></div>
            <span class="ar">→</span>
            <div class="cell"><i style="background-image:url('../assets/shot-drum-sq.jpg');transform:scale(1.3)"></i><span>改后</span></div>
          </div>
        </div>
      </div>
    </div>

    <div class="promise"><span><i></i>画面来源逐镜标注</span><span><i></i>修改不影响其他镜头</span><span><i></i>每个版本都保留</span></div>
  </section>

  <section class="form">
    <h1>设置新密码</h1>
    <div class="sub">为 chen@yunqi-windows.cn 设置一个新密码，保存后会直接回到你的项目。</div>
    <div class="field"><label>新密码</label><input class="f" type="password" value="••••••••••••"></div>
    <div class="meter"><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div>
    <div class="hint">强度不错 · 至少 8 位，含字母和数字</div>
    <div class="field"><label>再输入一次</label><input type="password" value="••••••••••••"></div>
    <button class="submit" style="margin-top:6px">保存并登录</button>
    <div class="foot"><a>← 回到登录</a></div>
  </section>
</div>
</body>
</html>
