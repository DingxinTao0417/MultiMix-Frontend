ry-row>span{color:var(--ink-3);font-size:9px}.operation-failure{margin:15px 26px 0;padding:9px 12px;border:1px solid #ecd1cb;border-radius:11px;background:#fff8f6;color:#99483d;font-size:10px}.export-actions{display:flex;align-items:center;gap:8px;padding:13px 26px 16px;border-top:1px solid var(--line-2)}.export-actions strong{font-size:11.5px}.export-actions span{color:var(--ink-3);font-size:9px}.export-actions .use:first-of-type{margin-left:auto}

<body>
  <header class="scenario-bar">
    <div class="scenario-name"><strong id="scenario-title">创作教练状态图谱</strong><span id="scenario-subtitle">统一工作台中的提示词位置</span></div>
    <nav class="scenario-nav" aria-label="切换场景"><button id="prev" type="button">←</button><select id="scenario-select" aria-label="选择场景"></select><button id="next" type="button">→</button></nav>
    <div class="scenario-meta"><strong id="scenario-type"></strong><span id="scenario-location"></span></div>
  </header>
  <main class="workspace">
    <div class="topbar"><span>项目</span><span>/</span><b>秋季新品推广</b><span>对话工作台</span></div>
    <div class="app">
      <aside class="sidebar">
        <div class="brand"><span class="mark">M</span>MultiMix</div><button class="new" type="button">＋ 新建创作</button><div class="search">⌕　搜索项目</div>
        <div class="projects"><h4>最近项目</h4><div class="project active">秋季新品推广<span>刚刚</span></div><div class="project">门店开业预热视频<span>昨天</span></div><div class="project">品牌故事短片<span>周一</span></div><div class="project">产品使用教程<span>8 月 28 日</span></div></div>
        <div class="profile"><span class="avatar">月</span><span>月文<br><small style="color:var(--ink-3)">个人工作区</small></span></div>
      </aside>
      <section class="chat"><header class="chat-head">秋季新品推广<span class="resource">资料</span></header><div class="messages" id="messages"></div><footer class="dock"><div class="composer" id="composer"><span class="attach">＋</span><span class="composer-text" id="composer-text">继续描述想法，或加入图片、视频、文档…</span><span class="send">↑</span></div></footer></section>
      <section class="display" id="display"></section>
    </div>
  </main>
  <script>
    const promptRows = (title, rows, note = "") => `
      <div class="prompt-inline"><header>${title}${note ? `<span>${note}</span>` : ""}</header>
      ${rows.map((row) => `<div class="prompt-row"><span>“${row}”</span><button class="use" data-prompt="${row}">带入</button></div>`).join("")}</div>`;

    const shelf = (title, rows, note = "根据当前内容推荐") => `
      <aside class="coach-shelf"><div class="shelf-head"><strong>${title}</strong><span>${note}</span></div>
      ${rows.map((row) => `<div class="shelf-row"><blockquote>“${row.text}”</blockquote><span class="scope"><b>${row.impact}</b><span>${row.keep}</span></span><button class="use" data-prompt="${row.text}">带入对话</button></div>`).join("")}</aside>`;

    const coach = (title, intro, recipes, footer) => `<div class="full-coach"><header><span class="kicker">Create by conversation</span><h1>${title}</h1><p class="intro">${intro}</p></header><div class="coach-title">你可以这样说 <span>只显示当前阶段可用的表达</span></div><div class="recipe-list">${recipes.map((r) => `<div class="recipe"><div class="recipe-copy"><small>${r.label}</small><blockquote>“${r.text}”</blockquote></div><div class="effect"><strong>${r.effect}</strong><div class="frames"><i></i><i></i><i></i><i></i></div><span>${r.path}</span></div><button class="use" data-prompt="${r.text}">带入对话</button></div>`).join("")}</div><footer class="coach-foot">${footer}</footer></div>`;

    const videoMain = () => `<div class="video-main"><div class="player-wrap"><div class="player"><div class="screen"><span class="screen-tag">秋季新品 · 轻装出发</span></div><div class="player-bar"><span>0:09</span><i></i><span>0:25</span></div></div></div><div class="scene-summary"><div class="summary-title">当前分镜 <span>3 个 · 25 秒</span></div><div class="summary-row"><i></i><div><strong>结果先出现</strong><small>轻便使用场景</small></div><span>0–4s</span></div><div class="summary-row"><i></i><div><strong>讲清两个卖点</strong><small>轻量设计 · 长续航</small></div><span>4–19s</span></div><div class="summary-row"><i></i><div><strong>品牌与行动</strong><small>新品信息 · 了解更多</small></div><span>19–25s</span></div></div></div>`;

    const assistant = (text) => `<div class="assistant"><span class="ai-dot">M</span><div class="ai-copy"><small>MultiMix</small><p>${text}</p></div></div>`;
    const user = (text) => `<div class="user-msg">${text}</div>`;
    const displayHead = (title, status = "", action = "详情") => `<header class="display-head"><strong>${title}</strong>${status ? `<span>${status}</span>` : ""}<button type="button">${action}</button></header>`;

    const scenarios = [
      {
        id:"01", name:"新建项目，尚未发消息", type:"开始创作", location:"右侧完整展示区",
        chat:`${assistant("告诉我你想做什么，也可以直接加入图片、视频或文档。")}`,
        display:coach("从一句想法开始，不需要先会写脚本","如果不知道怎样描述，可以从目标、已有资料或让 Agent 提问开始。",[
          {label:"从目标开始",text:"帮我做一条新品推广视频，先通过提问帮我把目标理清楚。",effect:"示例效果 · 形成清晰 brief",path:"目标 → 受众 → 重点 → 方案"},
          {label:"从资料开始",text:"我先上传一些资料，你判断哪些能用于内容和画面。",effect:"示例效果 · 先理解资料",path:"识别事实 → 匹配画面 → 说明缺口"},
          {label:"从参考感觉开始",text:"我想做得真实一点，不要太像传统广告。",effect:"示例效果 · 明确表达方向",path:"真实素材 → 自然节奏 → 弱化广告感"}
        ],"示例只帮助表达，不会直接生成或锁定结果。")
      },
      {
        id:"02", name:"已开始对话，需求仍然模糊", type:"补清需求", location:"右侧完整展示区",
        chat:`${user("我想做一条秋季新品短视频，但现在只有一个大概想法。")}${assistant("可以。我们先把这条视频给谁看、希望观众记住什么说清楚。")}<div class="quick"><span>第一次了解新品的人</span><span>突出轻便和续航</span><span>我还没想好</span></div>`,
        display:coach("把模糊想法变成可执行方向","不需要一次说完整。补充其中一项，Agent 就能继续追问并形成方案。",[
          {label:"补充观众",text:"主要给第一次了解这个产品的人看。",effect:"表达会更准确",path:"受众 → 语气 → 信息密度"},
          {label:"补充重点",text:"希望观众看完记住轻便和长续航。",effect:"内容会更聚焦",path:"核心卖点 → 镜头重点 → 字幕重点"},
          {label:"让 Agent 继续问",text:"我还没想清楚，你一次问我一个问题。",effect:"降低表达压力",path:"逐项提问 → 补齐需求 → 给出推荐"}
        ],"右侧只承担扫盲和表达帮助，真正对话仍然发生在左侧。")
      },
      {
        id:"03", name:"已经上传资料，尚未形成方案", type:"使用资料", location:"右侧完整展示区",
        chat:`${user("先用我上传的产品图和参数表，帮我做一条视频。")}<div class="asset-chips"><span class="asset-chip"><i class="asset-thumb"></i>新品正面图.jpg</span><span class="asset-chip"><i class="asset-thumb"></i>产品参数.pdf</span></div>${assistant("资料已经加入当前项目。我会先提取可用事实和画面，再形成创作方案。")}`,
        display:coach("告诉 Agent，这些资料应该怎样使用","资料已经存在时，提示重点从“上传什么”转为“哪些是权威依据、哪些画面优先”。",[
          {label:"限定事实边界",text:"参数只以这份 PDF 为准，不要补充资料里没有的数据。",effect:"减少事实偏差",path:"来源事实 → 证据边界 → 内容表达"},
          {label:"指定画面优先级",text:"优先使用产品正面图，缺少的生活场景可以再生成。",effect:"明确素材与生成边界",path:"已有素材优先 → 缺口识别 → 生成补齐"},
          {label:"先分析再创作",text:"先告诉我这些资料能支持哪些卖点，再开始写方案。",effect:"先建立共同理解",path:"理解资料 → 列出依据 → 形成方案"}
        ],"不显示虚构的素材数量或完成进度，只解释资料使用方式。")
      },
      {
        id:"04", name:"等待确认创作方案", type:"修改确认项", location:"左侧确认卡下方",
        chat:`${user("做成适合抖音的新品视频，重点讲轻便和续航。")}${assistant("我整理了一版创作方案，确认后再生成编导稿。")}<div class="inline-card"><h3>确认创作方案</h3><p>产品推广 · 真实自然 · 已有素材为主</p><div class="field"><span>交付</span><b>9:16 · 25 秒</b></div><div class="field"><span>声音</span><b>AI 旁白</b></div><div class="field"><span>重点</span><b>轻便、长续航</b></div></div>${promptRows("想调整？可以直接说",["改成 20 秒，保留两个核心卖点。","先不要 AI 配音，只保留字幕。","为什么推荐真实自然的表达？"],"紧邻确认卡")}`,
        display:`<div class="plan-board"><header><span class="kicker">What happens next</span><h1>确认后，会得到一份可继续修改的编导稿</h1><p>右侧不重复确认按钮，只解释下一步产物。</p></header><div class="plan-steps"><div class="plan-step"><b>01</b><strong>确认当前方向</strong><span>当前</span></div><div class="plan-step"><b>02</b><strong>形成编导稿与分镜</strong><span>下一步</span></div><div class="plan-step"><b>03</b><strong>生成可编辑视频工程</strong><span>之后仍可修改</span></div></div></div>`
      },
      {
        id:"05", name:"已经生成编导稿", type:"优化内容", location:"右侧编导稿底部",
        chat:`${assistant("编导稿已经生成。我把“轻便出行”作为开场，用两个场景解释轻量设计和长续航。") }<div class="inline-card"><h3>编导稿 · v1</h3><p>25 秒 · 3 个分镜 · 等待确认</p></div>`,
        display:`${displayHead("编导稿 · v1","待确认")}<div class="document"><article class="document-sheet"><span class="doc-meta">秋季新品推广 · 25 秒</span><h1>轻装出发，续航一整天</h1><h2>开场 · 0–4 秒</h2><p>先展示用户把产品轻松放进随身包，屏幕文字直接出现“轻一点，走得更远”。</p><h2>卖点展开 · 4–19 秒</h2><p>使用近景说明轻量设计，再切换到一整天使用场景，突出长续航。</p><h2>收束 · 19–25 秒</h2><p>回到产品与品牌画面，引导了解新品详情。</p></article>${shelf("还可以这样调整",[{text:"开头先展示使用结果，不要先介绍产品。",impact:"预计影响：开场 4 秒",keep:"其他段落保持不变"},{text:"整体语气更像真实体验，不要使用广告口号。",impact:"预计影响：全篇表达",keep:"结构和事实保持不变"}])}</div>`
      },
      {
        id:"06", name:"正在查看某个分镜", type:"修改当前分镜", location:"当前分镜附近",
        chat:`${assistant("当前选中第 2 镜。你可以继续说想换什么画面、怎样调整口播或是否增加动效。")}`,
        display:`${displayHead("分镜方案 · v1","第 2 镜已选中")}<div class="storyboard"><header><span class="kicker">Storyboard</span><h1>逐镜调整画面与表达</h1></header><div class="story-grid"><div class="scene"><span class="scene-no">01</span><i class="scene-thumb"></i><span class="scene-copy"><strong>结果先出现</strong><small>轻便出行场景 · 4 秒</small></span><button class="use" data-prompt="修改第 1 镜">选择</button></div><div class="scene selected"><span class="scene-no">02</span><i class="scene-thumb"></i><span class="scene-copy"><strong>轻量设计细节</strong><small>产品近景 · 8 秒</small></span><button class="use" data-prompt="修改第 2 镜">当前</button></div><div class="scene-coach"><span>“第 2 镜换成产品细节，不要出现人物。”</span><button class="use" data-prompt="第 2 镜换成产品细节，不要出现人物。">带入对话</button></div><div class="scene"><span class="scene-no">03</span><i class="scene-thumb"></i><span class="scene-copy"><strong>续航与行动引导</strong><small>全天使用 · 13 秒</small></span><button class="use" data-prompt="修改第 3 镜">选择</button></div></div></div>`
      },
      {
        id:"07", name:"视频正在生成", type:"查询状态", location:"左侧进度卡下方",
        chat:`${user("确认，生成视频工程。")}${assistant("已经开始生成。任务会在后台继续，你可以离开当前对话。") }<div class="inline-card"><h3>正在生成视频</h3><p>已经完成编导与素材匹配，正在生成画面和字幕。</p></div>${promptRows("现在可以问",["现在进行到哪一步？","哪些镜头会使用我的素材？"],"只读问题")}`,
        display:`${displayHead("视频工程","生成中")}<div class="display-body"><div class="generation"><div class="generation-card"><h2>正在制作视频</h2><p>作品尚未完成，现在不会展示虚构的预览。</p><div class="progress"><i></i></div><div class="steps"><span>编导方案已确认</span><span>素材与分镜已匹配</span><span class="current">正在生成画面和字幕</span></div></div></div><div class="passive-tip">生成完成后，可以继续通过对话调整镜头、节奏、字幕和声音。</div></div>`
      },
      {
        id:"08", name:"视频已经完成", type:"继续修改成片", location:"播放器与分镜摘要下方",
        chat:`${assistant("视频工程已经生成，可以继续通过对话调整镜头、节奏、字幕或声音。") }<div class="inline-card"><h3>视频工程 · v1</h3><p>25 秒 · 3 个分镜 · 可播放、编辑和导出</p></div>`,
        display:`${displayHead("视频工程 · v1","已完成")}<div class="video-result">${videoMain()}${shelf("接下来可以这样改",[{text:"开头直接展示使用结果，不要先介绍背景。",impact:"预计影响：开头 4 秒",keep:"其他分镜保持不变"},{text:"字幕再大一点，重点数字使用品牌紫。",impact:"预计影响：全片字幕",keep:"画面和声音保持不变"}])}</div>`
      },
      {
        id:"09", name:"某次修改失败", type:"恢复与重试", location:"左侧失败卡旁边",
        chat:`${user("把第 2 镜换成我刚上传的产品图。")}${assistant("这次替换没有完成，上一版视频仍然可以正常播放和导出。") }<div class="inline-card failure-card"><h3>第 2 镜素材替换失败</h3><p>新素材暂时无法生成有效画面，稳定版本没有被覆盖。</p></div>${promptRows("可以这样处理",["只重试第 2 镜的素材替换。","保留当前版本，先告诉我失败原因。","换回上一张可用素材。"],"恢复操作")}`,
        display:`${displayHead("视频工程 · v1","上一稳定版本")}<div class="video-result failure-state"><div class="operation-failure">本次“第 2 镜素材替换”失败，当前仍显示上一稳定版本。</div>${videoMain()}</div>`
      },
      {
        id:"10", name:"准备导出或发布", type:"交付与发布", location:"右侧结果底部",
        chat:`${assistant("当前视频已经可以导出。你也可以继续准备封面、平台比例或发布文案。")}`,
        display:`${displayHead("视频工程 · v1","可以导出")}<div class="video-result">${videoMain()}<footer class="export-actions"><strong>准备交付</strong><span>围绕当前稳定版本</span><button class="use" data-prompt="导出一份 9:16 高清视频。">导出 9:16</button><button class="use" data-prompt="为这条视频生成一张 4:5 封面。">生成封面</button><button class="use" data-prompt="根据这条视频写一版小红书发布文案。">发布文案</button></footer></div>`
      },
      {
        id:"11", name:"返回一个暂停项目", type:"恢复任务", location:"左侧任务条与最新回复",
        chat:`<div class="task-strip">当前：完善秋季新品编导稿 <span>1 个暂停任务</span></div>${assistant("欢迎回来。上次停在编导稿确认前，当前版本和素材都已保留。")}${promptRows("继续这个项目",["继续上次的编导稿。","先告诉我当前还差什么。","返回之前暂停的封面任务。"],"恢复上下文")}`,
        display:`${displayHead("编导稿 · v1","等待继续")}<div class="document"><article class="document-sheet"><span class="doc-meta">上次编辑于昨天 18:42</span><h1>轻装出发，续航一整天</h1><h2>当前状态</h2><p>编导稿已经形成，视频比例、时长和素材关系仍然保留。继续后不会重新创建项目或丢失当前工作对象。</p><h2>待处理</h2><p>确认当前编导稿，或继续修改开场与第二镜的产品细节表达。</p></article></div>`
      },
      {
        id:"12", name:"查看收藏和常用表达", type:"个人表达库", location:"独立抽屉，不常驻占位",
        chat:`${assistant("你可以从常用表达中选择一句带入当前对话，也可以继续直接描述。")}`,
        display:`${displayHead("视频工程 · v1","已完成","关闭表达库")}<div class="drawer-stage">${videoMain()}<aside class="prompt-drawer"><div class="drawer-head"><strong>我的常用表达</strong><span>6 条</span></div><div class="drawer-section">最近常用</div><div class="saved-prompt"><blockquote>“整体更像真实体验，不要太广告。”<small>已使用 4 次 · 内容与语气</small></blockquote><button class="use" data-prompt="整体更像真实体验，不要太广告。">带入</button></div><div class="saved-prompt"><blockquote>“开头先给结果，再解释原因。”<small>已使用 3 次 · 内容结构</small></blockquote><button class="use" data-prompt="开头先给结果，再解释原因。">带入</button></div><div class="drawer-section">品牌固定要求</div><div class="saved-prompt"><blockquote>“重点数字使用品牌紫，其他字幕保持白色。”<small>用户主动收藏 · 字幕样式</small></blockquote><button class="use" data-prompt="重点数字使用品牌紫，其他字幕保持白色。">带入</button></div><div class="saved-prompt"><blockquote>“结尾保留品牌标志，但不要出现强促销口号。”<small>用户主动收藏 · 品牌收束</small></blockquote><button class="use" data-prompt="结尾保留品牌标志，但不要出现强促销口号。">带入</button></div></aside></div>`
      }
    ];

    const select = document.getElementById("scenario-select");
    scenarios.forEach((scenario, index) => { const option=document.createElement("option"); option.value=scenario.id; option.textContent=`${String(index+1).padStart(2,"0")} · ${scenario.name}`; select.appendChild(option); });

    function bindPromptButtons(){document.querySelectorAll(".use").forEach((button)=>button.addEventListener("click",()=>{const text=button.dataset.prompt||button.textContent.trim();const composer=document.getElementById("composer");const composerText=document.getElementById("composer-text");composerText.textContent=text;composerText.classList.add("filled");composer.classList.remove("pulse");requestAnimationFrame(()=>composer.classList.add("pulse"));setTimeout(()=>composer.classList.remove("pulse"),800)}));}
    function render(id){const scenario=scenarios.find((item)=>item.id===id)||scenarios[0];select.value=scenario.id;document.getElementById("scenario-title").textContent=`${scenario.id} · ${scenario.name}`;document.getElementById("scenario-subtitle").textContent="对话创作教练 12 状态视觉图谱";document.getElementById("scenario-type").textContent=`提示类型：${scenario.type}`;document.getElementById("scenario-location").textContent=`显示位置：${scenario.location}`;document.getElementById("messages").innerHTML=scenario.chat;document.getElementById("display").innerHTML=scenario.display;const composerText=document.getElementById("composer-text");composerText.textContent="继续描述想法，或从提示中带入一句表达…";composerText.classList.remove("filled");bindPromptButtons();const url=new URL(location.href);url.searchParams.set("s",scenario.id);history.replaceState({},"",url);}
    function move(delta){const current=scenarios.findIndex((item)=>item.id===select.value);render(scenarios[(current+delta+scenarios.length)%scenarios.length].id)}
    select.addEventListener("change",()=>render(select.value));document.getElementById("prev").addEventListener("click",()=>move(-1));document.getElementById("next").addEventListener("click",()=>move(1));
    render(new URLSearchParams(location.search).get("s")||"01");
  </script>
</body>
</html>
